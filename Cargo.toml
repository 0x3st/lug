[workspace]
resolver = "2"
members = ["crates/lug-engine", "crates/lug-server", "crates/lug-worker"]

[workspace.package]
version = "1.0.0-alpha.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sha2 = "0.10"
rand = "0.9"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
lug-engine = { path = "crates/lug-engine" }
# —— CF Workers（wasm-only crate，仅 lug-worker 引用；host 构建不编译）——
worker = { version = "0.9", features = ["http", "axum"] }
worker-macros = { version = "0.9", features = ["http"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
