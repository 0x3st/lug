[package]
name = "lug-worker"
description = "Lug CF Workers 入口：axum Router 挂 fetch handler（workers-rs），引擎零改动链接"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib = wrangler/worker-build 的 wasm 部署产物；rlib = host 单测可链接。
crate-type = ["cdylib", "rlib"]

[dependencies]
# 通用依赖（host 亦编译可测）。axum 必须 default-features = false：
# 默认 feature 含 tokio/hyper，Workers 上无 tokio reactor（tech-notes §1）。
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3.3"
futures = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# worker 随 T7 集成移入门控外公共依赖（集成侧调整）：storage/oauth 模块
# 无条件 `use worker::*`，而 host 单测必须覆盖 T5/T6 用例——T5/T6 分支实证
# worker 0.9 可 host 编译链接，骨架「worker 是 wasm-only crate」前提不成立。
worker = { workspace = true, features = ["d1"] }
# NOTE: rand/getrandom intentionally NOT used — getrandom has no default wasm32
# backend; randomness comes from Workers crypto (web_sys getRandomValues), see
# crates/lug-worker/src/oauth/random.rs (T6).

# 仅 wasm32 入口胶水（entry.rs 的 #[event(fetch)]）使用：host 不编译。
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker-macros = { workspace = true }
http = "1"

[dev-dependencies]
# host 单测：读响应体 / 测试运行时（wasm32 check 不编译 dev-deps）
http-body-util = "0.1"
tokio = { workspace = true }
