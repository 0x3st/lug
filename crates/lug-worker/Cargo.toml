[package]
name = "lug-worker"
description = "Lug CF Workers 入口：axum Router 挂 fetch handler（workers-rs），引擎零改动链接"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib = wrangler/worker-build 的 wasm 部署产物；rlib = host 单测可链接。
crate-type = ["cdylib", "rlib"]

[dependencies]
# 通用依赖（host 亦编译可测）。axum 必须 default-features = false：
# 默认 feature 含 tokio/hyper，Workers 上无 tokio reactor（tech-notes §1）。
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3.3"
futures = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# T7.5 接线：真链接计算引擎（退役 sse.rs 的 lug_engine_shim）。
# 纯计算库（num-bigint/num-traits），依赖树 wasm32 兼容（wasm check 实证）。
lug-engine = { workspace = true }
# worker 随 T7 集成移入门控外公共依赖（集成侧调整）：storage/oauth 模块
# 无条件 `use worker::*`，而 host 单测必须覆盖 T5/T6 用例——T5/T6 分支实证
# worker 0.9 可 host 编译链接，骨架「worker 是 wasm-only crate」前提不成立。
worker = { workspace = true, features = ["d1"] }
# NOTE: rand/getrandom intentionally NOT used — getrandom has no default wasm32
# backend; randomness comes from Workers crypto (web_sys getRandomValues), see
# crates/lug-worker/src/oauth/random.rs (T6).
# T6-oauth 追加：web-sys 仅用于 oauth/random.rs 的 CSPRNG（crypto.getRandomValues，
# 即 rand::RngCore::fill_bytes 的 wasm32 等价物；rand/getrandom 无默认 wasm32 后端，
# skeleton 6c77725 已撤销）。版本对齐 worker 0.9 的锁定版本：
# cargo tree -p worker -i web-sys → web-sys 0.3.107。
# 集成侧调整：保持门控外公共依赖——oauth/random.rs 在未门控模块中以裸
# web_sys:: 路径引用 Crypto/WorkerGlobalScope，若门控进 wasm32 段则 oauth
# 无法 host 编译，26 个 oauth host 用例全部丢失（host 单测仍不触达运行时
# getRandomValues，wasm-bindgen 导入桩 host 下仅编译不执行）。
web-sys = { version = "0.3.107", features = ["Crypto", "WorkerGlobalScope"] }

# 仅 wasm32 入口胶水（entry.rs 的 #[event(fetch)]）使用：host 不编译。
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker-macros = { workspace = true }
http = "1"

[dev-dependencies]
# host 单测：读响应体 / 测试运行时（wasm32 check 不编译 dev-deps）
http-body-util = "0.1"
tokio = { workspace = true }
# C10 golden 对照：进程内链接 lug-server（契约源），经 tower oneshot 驱动其
# router() 与 lug-worker 纯函数 builders 逐字节对照（tests/golden_vs_server.rs）。
# 仅进 host 测试树——wasm32 依赖树用 `cargo tree -e no-dev` 证实不含
# lug-server/rand（rand 审计 C10）。
lug-server = { path = "../lug-server" }
tower = { version = "0.5", features = ["util"] }
